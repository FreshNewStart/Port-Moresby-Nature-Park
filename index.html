<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER APP</title>
</head>
<body>

    <script src="./qrScript.js"></script>

    <div style="text-align: center;">
        <div id="reader" style="width: 500px;"></div>

        <div id="show" style="display: none;">
            <h4>Scanned Result</h4>
            <p style="color: blue;" id="result"></p>
        </div>
    </div>

    <script>
    const html5Qrcode = new Html5Qrcode('reader');

    const qrCodeSuccessCallback = async (decodedText, decodedResult) => {
        if (!decodedText) return;

        // Show result
        document.getElementById('show').style.display = 'block';
        document.getElementById('result').textContent = decodedText;

        // Stop scanner first
        await html5Qrcode.stop();

        // Clean the scanned text
        let text = decodedText.trim();

        // Auto-fix missing protocol (VERY IMPORTANT)
        if (text.startsWith("www.")) {
            text = "https://" + text;
        }

        // Check if it's a valid URL
        let isUrl = false;

        try {
            const url = new URL(text);
            isUrl = url.protocol === "http:" || url.protocol === "https:";
        } catch (e) {
            isUrl = false;
        }

        // Redirect if valid
        if (isUrl) {
            window.location.href = text;
        } else {
            console.log("Not a valid URL:", text);
        }
    };

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
    };

    html5Qrcode.start(
        { facingMode: "environment" },
        config,
        qrCodeSuccessCallback
    );
</script>

</body>
</html>
