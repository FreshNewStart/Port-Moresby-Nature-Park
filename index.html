<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER APP</title>
</head>
<body>

    <script src="./qrScript.js"></script>

    <div style="text-align: center;">
        <div id="reader" style="width: 500px;"></div>

        <div id="show" style="display: none;">
            <h4>Scanned Result</h4>
            <p style="color: blue;" id="result"></p>
        </div>
    </div>

    <script>
        const html5Qrcode = new Html5Qrcode('reader');

        const qrCodeSuccessCallback = async (decodedText, decodedResult) => {
            if (!decodedText) return;

            // DEBUG: always see what is scanned
            console.log("RAW SCAN:", decodedText);
            alert(decodedText);

            // show result on UI
            document.getElementById('show').style.display = 'block';
            document.getElementById('result').textContent = decodedText;

            // stop scanner
            await html5Qrcode.stop();

            // clean text (remove spaces, line breaks, hidden chars)
            let text = decodedText.trim().replace(/\s/g, "");

            // auto-fix missing protocol
            if (!text.startsWith("http://") && !text.startsWith("https://")) {
                text = "https://" + text;
            }

            console.log("REDIRECTING TO:", text);

            // try multiple redirect methods (max compatibility)
            setTimeout(() => {
                try {
                    // best modern method
                    window.location.assign(text);
                } catch (e) {
                    console.error("Redirect failed:", e);

                    // fallback
                    window.open(text, "_blank");
                }
            }, 200);
        };

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        };

        html5Qrcode.start(
            { facingMode: "environment" },
            config,
            qrCodeSuccessCallback
        );
    </script>

</body>
</html>
