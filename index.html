<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR SCANNER</title>

    <!-- QR Library (IMPORTANT: must be loaded like this) -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #reader {
            width: 400px;
            max-width: 100%;
            margin: auto;
        }

        #result {
            color: blue;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h2>QR Scanner</h2>

    <div id="reader"></div>

    <div id="show" style="display:none; margin-top:20px;">
        <h4>Scanned Result</h4>
        <p id="result"></p>
    </div>

    <script>
        const html5Qrcode = new Html5Qrcode("reader");

        function isValidUrl(text) {
            try {
                const url = new URL(text);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch {
                return false;
            }
        }

        const qrCodeSuccessCallback = async (decodedText) => {
            if (!decodedText) return;

            console.log("RAW SCAN:", decodedText);

            // Show result
            document.getElementById("show").style.display = "block";
            document.getElementById("result").textContent = decodedText;

            // Stop scanner
            try {
                await html5Qrcode.stop();
            } catch (e) {
                console.log("Scanner stop error:", e);
            }

            // Clean QR text
            let text = decodedText.trim().replace(/\s/g, "");

            // Fix missing protocol
            if (text.startsWith("www.")) {
                text = "https://" + text;
            }

            console.log("CLEAN URL:", text);

            // Redirect ONLY if valid URL
            if (isValidUrl(text)) {
                console.log("REDIRECTING...");
                setTimeout(() => {
                    window.location.href = text;
                }, 300);
            } else {
                console.log("Not a URL, no redirect.");
            }
        };

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        };

        html5Qrcode.start(
            { facingMode: "environment" },
            config,
            qrCodeSuccessCallback
        );
    </script>

</body>
</html>
